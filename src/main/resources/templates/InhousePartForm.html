<!DOCTYPE html>
<html lang="en">
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Part Form</title>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <!-- background image-->
    <style>
        body {
            background-image: url('/images/motherboard.jpg');
            background-color: rgb(128 86 187 / 0.49);
            background-size: cover;
            background-attachment: fixed;
        }
    </style>

    <style>
        .container{
            background-color: rgb(128 86 187 / 0.44) ;
            position: relative;
            height: 600px;
            display: flex;
            justify-content: center;
            width: 100%;
        }
        .fields {
            text-align: left;
        }

        p {
        font-family: "Malgun Gothic";
        color: white;
        font-size: 30px;
        }
    </style>
    <!--styling for buttons-->
    <style>
        .button{
            margin-left:  55px;
            margin-top: 15px;
            margin-bottom: 20px;
            padding: 10px;
            padding-left: 10px;
            padding-right: 10px;

            font-family: "Malgun Gothic";
            font-size: 20px;
            color: #8056bb;
            border: none;
            border-radius: 5px;

            cursor: pointer;
        }
        .button:hover{
            color: white;
            background-color: #8056bb;
            transition-duration: 0.5s;
        }

    </style>

    <style> h1 { font-family: "Candara"; font-weight: bold; color: rgb(255 255 255); text-align: center; font-size: 4rem;
    }</style>
</head>

<body>
<div class="Title" style="background-color: rgb(128 86 187 / 0.95); position: relative; height: 150px;">
    <br>
    <h1 style="font-size: 50px">Inhouse Part Detail</h1>
</div>

<div class="container">

    <div class = "fields">

<form action="#" th:action="@{/showFormAddInPart}" th:object="${inhousepart}" method="POST"}>
<!-- Add hidden form field to handle update -->

    <p><input type="hidden" th:field="*{id}"/></p>

    <p>Name: <input type="text" th:field="*{name}" placeholder="Name" class="form-control mb-4 col-4"/> </p>

    <p>Price: <input type="text" path="price" th:field="*{price}" placeholder= "Price" class="form-control mb-4 col-4"/></p>
    <p th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Price Error</p>

    <p>Inventory: <input type="text" path="inv" th:field="*{inv}" placeholder="Inventory" class="form-control mb-4 col-4"/></p>
    <p th:if="${#fields.hasErrors('inv')}" th:errors="*{inv}">Inventory Error</p>
    <!-- min and max inventory-->

    <p>Min Inventory: <input type="text" path="minInv" th:field="*{minInv}" placeholder="Min Inventory" class="form-control mb-4 col-4"/></p>
    <p th:if="${#fields.hasErrors('minInv')}" th:errors="*{minInv}">Min Inventory Error</p>

    <p>Max Inventory: <input type="text" path="maxInv" th:field="*{maxInv}" placeholder="Max Inventory" class="form-control mb-4 col-4"/></p>
    <p th:if="${#fields.hasErrors('maxInv')}" th:errors="*{maxInv}">Max Inventory Error</p>

    <p>Part ID: <input type="text" th:field="*{partId}" placeholder="Part ID" class="form-control mb-4 col-4"/></p>

    <div th:if="${#fields.hasAnyErrors()}">
        <ul>
            <li th:each="err: ${#fields.allErrors()}" th:text="${err}" style="color: white;">

            </li>

        </ul>
    </div>
        <p><input type="submit" value="Submit"/></p>
    </div>
</form>
    <p><errors path="price" cssClass=""error/></p>

</div>
<br>
<div style="justify-content: center; display: flex;">
    <form th:action="@{/mainscreen}">
        <button class= "button" name="products">Main Screen</button>
    </form>
</div>


</body>
</html>
