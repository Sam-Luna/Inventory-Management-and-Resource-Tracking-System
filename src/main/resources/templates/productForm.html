<!DOCTYPE html>
<html lang="en">
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Part Form</title>

   <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <style>
        body {
            background-image: url('/images/motherboard.jpg');
            background-color: rgb(128 86 187 / 0.49);
            background-size: cover;
            background-attachment: fixed;
        }
        .box{
            background-color: rgb(128 86 187 / 0.44) ;
            background-size: cover;
            grid-template-columns: repeat(3, 1fr);
            justify-content: center;
            gap: 10px;

            padding: 100px;
            display: grid;
            height: 100%;
            width: 100%;

        }
        .box1{
            flex: 1;
            background-color: rgb(128 86 187 / 0.44);
            padding: 50px;
        }
    </style>
    <!--styling for buttons-->
    <style>
        .button{
            padding: 10px;
            padding-left: 10px;
            padding-right: 10px;

            font-family: "Malgun Gothic";
            font-size: 20px;
            color: #8056bb;
            border: none;
            border-radius: 5px;

            cursor: pointer;
        }
        .button:hover{
            color: white;
            background-color: #8056bb;
            transition-duration: 0.5s;
        }

    </style>

    <style>
       p{
           color: white;
       }
       h2{
          font-family:'Malgun Gothic Semilight';
           color: white;
       }
    </style>
</head>
<body>
<div class="box" style="background-color: rgb(128 86 187 / 0.44);" >
<div class="box1">
    <br>
<form action="#" th:action="@{/showFormAddProduct}" th:object="${product}" method="POST"}>
    <!-- Add hidden form field to handle update -->
    <h1 style="color: white">Product Detail</h1>
    <p><input type="hidden" th:field="*{id}"/></p>
    <p>Name: <input type="text" th:field="*{name}" placeholder="Name" class="form-control mb-4 col-4"/></p>

    <p>Price: <input type="text" th:field="*{price}" placeholder= "Price" class="form-control mb-4 col-4"/></p>


    <p>Inventory: <input type="text" th:field="*{inv}" placeholder="Inventory" class="form-control mb-4 col-4"/></p>

    <p>
    <div th:if="${#fields.hasAnyErrors()}">
    <ul><li th:each="err: ${#fields.allErrors()}" th:text="${err}" style="color: white;"></li></ul>
    </div>
    </p>
    <p><input type="submit" value="Submit" /></p>
</form>

    <!-- button to the about page-->
    <form th:action="@{/mainscreen}">
        <button class= "button" name="products"> Main Screen</button>
    </form>

</div>
<div class= "box1" >
<table class="table " style="background-color: rgb(220 202 253 / 0.92); width: 500xp;">

    <thead class="thead-dark" style=" background-color: rgb(128 86 187 / 0.44);">
    <tr><h2>Available Parts</h2></tr>
    <tr>
        <th>Name</th>
        <th>Price</th>
        <th>Inventory</th>
        <th>Action</th>
    </tr>
    </thead>
    <body>
    <tr th:each="tempPart : ${availparts}">
        <td th:text="${tempPart.name}">1</td>
        <td th:text="${tempPart.price}">1</td>
        <td th:text="${tempPart.inv}">1</td>
        <td><a th:href="@{/associatepart(partID=${tempPart.id})}" class="btn btn-primary btn-sm mb-3">Add</a>
        </td>
    </tr>
    </body>
</table>
</div>
    <div class= "box1" >
    <table class="table table-bordered table-striped" style="background-color: rgb(220 202 253 / 0.92)">
        <thead class="thead-dark">
        <br>
        <h2>Associated Parts</h2>
        <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Inventory</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tempPart : ${assparts}">
            <td th:text="${tempPart.name}">1</td>
            <td th:text="${tempPart.price}">1</td>
            <td th:text="${tempPart.inv}">1</td>
            <td><a th:href="@{/removepart(partID=${tempPart.id})}"  class="btn btn-primary btn-sm mb-3">Remove</a>
            </td>
        </tr>
        </tbody>
    </table>
    </div>
</div>
</body>
</html>
